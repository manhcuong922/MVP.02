  <text x="124" y="146" fill="#1E293B" font-size="42" font-family="Arial" font-weight="700">Tong quan do an tang truong Q2</text>
  <text x="124" y="194" fill="#64748B" font-size="22" font-family="Arial">Ban sketch tong hop scope, nhan su va cac dau muc ban giao.</text>
  <text x="124" y="318" fill="#0F172A" font-size="28" font-family="Arial" font-weight="700">Moc chinh</text>
  <text x="124" y="360" fill="#475569" font-size="22" font-family="Arial">1. Chot dashboard KPI   2. Duyet deck doi tac   3. Dong bo CRM va pipeline</text>
  <text x="124" y="490" fill="#0F766E" font-size="24" font-family="Arial" font-weight="700">Nhanh van hanh</text>
  <text x="124" y="530" fill="#334155" font-size="20" font-family="Arial">Theo doi SLA, canh bao qua han, quy trinh phan hoi.</text>
  <text x="542" y="490" fill="#1D4ED8" font-size="24" font-family="Arial" font-weight="700">Nhanh CRM</text>
  <text x="542" y="530" fill="#334155" font-size="20" font-family="Arial">Lam sach lead, cadence cham soc, dieu phoi data.</text>
  <text x="960" y="490" fill="#7C3AED" font-size="24" font-family="Arial" font-weight="700">Nhanh doi tac</text>
  <text x="960" y="530" fill="#334155" font-size="20" font-family="Arial">Deck hop tac, danh sach su kien, co-marketing.</text>
